<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>C2 — Diagrama de Container</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #070d1a; font-family: 'Inter', sans-serif; color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 32px 24px; }
    .breadcrumb { display: flex; gap: 8px; align-items: center; font-size: 11px; color: #475569; margin-bottom: 24px; }
    .breadcrumb span { color: #334155; }
    .breadcrumb strong { color: #7dd3fc; }
    h1 { font-size: 22px; font-weight: 700; color: #f1f5f9; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #64748b; margin-bottom: 32px; }
    .diagram-wrap { background: #0d1526; border: 1px solid #1e293b; border-radius: 16px; padding: 8px; width: 100%; max-width: 1020px; }
    svg { display: block; width: 100%; height: auto; }
    .legend { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; justify-content: center; }
    .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #94a3b8; }
    .legend-dot { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }
    .note { margin-top: 28px; font-size: 11px; color: #334155; font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body>
  <div class="breadcrumb">
    <span>gym-survey-app</span> / <span>C4 Model</span> / <strong>C2 — Container</strong>
  </div>
  <h1>C2 — Diagrama de Container</h1>
  <p class="subtitle">Decisões tecnológicas de alto nível e como os containers se comunicam</p>

  <div class="diagram-wrap">
    <svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0,8 3,0 6" fill="#475569"/>
        </marker>
        <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0,8 3,0 6" fill="#60a5fa"/>
        </marker>
      </defs>

      <!-- Background -->
      <rect width="1000" height="680" fill="#0d1526" rx="12"/>

      <!-- Title -->
      <text x="500" y="36" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="700" font-family="Inter,sans-serif">Sistema de Avaliação de Academia</text>
      <text x="500" y="56" text-anchor="middle" fill="#475569" font-size="11" font-family="Inter,sans-serif">Nível 2 — Diagrama de Container</text>

      <!-- ── SYSTEM BOUNDARY ── -->
      <rect x="220" y="78" width="620" height="470" rx="14" fill="none" stroke="#1e3a5f" stroke-width="2" stroke-dasharray="8,4"/>
      <text x="530" y="96" text-anchor="middle" fill="#1e3a5f" font-size="10" font-weight="600" font-family="Inter,sans-serif" letter-spacing="1">SISTEMA DE AVALIAÇÃO DE ACADEMIA</text>

      <!-- ── PEOPLE (outside boundary) ── -->
      <!-- Aluno -->
      <circle cx="90" cy="186" r="22" fill="#1d4ed8" stroke="#3b82f6" stroke-width="1.5"/>
      <circle cx="90" cy="180" r="7" fill="white" opacity="0.9"/>
      <rect cx="90" cy="192" width="16" height="10" rx="2" fill="white" opacity="0.9" x="82" y="191"/>
      <rect x="38" y="210" width="104" height="64" rx="10" fill="#1d4ed8" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="90" y="232" text-anchor="middle" fill="white" font-size="12" font-weight="700" font-family="Inter,sans-serif">Aluno</text>
      <line x1="38" y1="244" x2="142" y2="244" stroke="#3b82f6" stroke-width="0.5" opacity="0.4"/>
      <text x="90" y="257" text-anchor="middle" fill="#93c5fd" font-size="9" font-family="Inter,sans-serif">[Person]</text>
      <text x="90" y="268" text-anchor="middle" fill="#bfdbfe" font-size="8" font-family="Inter,sans-serif">Frequentador</text>

      <!-- Admin -->
      <circle cx="90" cy="430" r="22" fill="#1d4ed8" stroke="#3b82f6" stroke-width="1.5"/>
      <circle cx="90" cy="424" r="7" fill="white" opacity="0.9"/>
      <rect x="82" y="435" width="16" height="10" rx="2" fill="white" opacity="0.9"/>
      <rect x="28" y="454" width="124" height="64" rx="10" fill="#1d4ed8" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="90" y="476" text-anchor="middle" fill="white" font-size="12" font-weight="700" font-family="Inter,sans-serif">Administrador</text>
      <line x1="28" y1="488" x2="152" y2="488" stroke="#3b82f6" stroke-width="0.5" opacity="0.4"/>
      <text x="90" y="501" text-anchor="middle" fill="#93c5fd" font-size="9" font-family="Inter,sans-serif">[Person]</text>
      <text x="90" y="512" text-anchor="middle" fill="#bfdbfe" font-size="8" font-family="Inter,sans-serif">Gestor da Academia</text>

      <!-- ── CONTAINERS INSIDE BOUNDARY ── -->

      <!-- Web Application -->
      <rect x="240" y="110" width="240" height="148" rx="10" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
      <text x="360" y="134" text-anchor="middle" fill="white" font-size="13" font-weight="700" font-family="Inter,sans-serif">Web Application</text>
      <line x1="240" y1="148" x2="480" y2="148" stroke="#3b82f6" stroke-width="0.5" opacity="0.5"/>
      <text x="360" y="163" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600" font-family="Inter,sans-serif">[Container: Next.js 16]</text>
      <text x="360" y="181" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="Inter,sans-serif">Totem público (5 etapas)</text>
      <text x="360" y="196" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="Inter,sans-serif">Painel administrativo</text>
      <text x="360" y="211" text-anchor="middle" fill="#64748b" font-size="9" font-family="Inter,sans-serif">TypeScript · Tailwind · PWA</text>
      <text x="360" y="226" text-anchor="middle" fill="#64748b" font-size="9" font-family="Inter,sans-serif">Static Export (output: export)</text>
      <text x="360" y="245" text-anchor="middle" fill="#475569" font-size="9" font-style="italic" font-family="Inter,sans-serif">hospedado no Firebase Hosting</text>

      <!-- Firestore Database -->
      <rect x="530" y="110" width="190" height="130" rx="10" fill="#164e3a" stroke="#10b981" stroke-width="1.5"/>
      <!-- DB icon -->
      <ellipse cx="625" cy="135" rx="30" ry="9" fill="#10b981" opacity="0.3" stroke="#10b981" stroke-width="1"/>
      <rect x="595" y="135" width="60" height="24" fill="#164e3a"/>
      <ellipse cx="625" cy="159" rx="30" ry="9" fill="none" stroke="#10b981" stroke-width="1" opacity="0.5"/>
      <text x="625" y="181" text-anchor="middle" fill="white" font-size="12" font-weight="700" font-family="Inter,sans-serif">Firestore</text>
      <line x1="530" y1="193" x2="720" y2="193" stroke="#10b981" stroke-width="0.5" opacity="0.4"/>
      <text x="625" y="207" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="600" font-family="Inter,sans-serif">[Container: NoSQL DB]</text>
      <text x="625" y="222" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="Inter,sans-serif">avaliacoes · colaboradores · config</text>
      <text x="625" y="235" text-anchor="middle" fill="#64748b" font-size="9" font-family="Inter,sans-serif">Cloud Firestore — real-time sync</text>

      <!-- Firebase Auth -->
      <rect x="530" y="270" width="190" height="110" rx="10" fill="#3b2200" stroke="#f97316" stroke-width="1.5"/>
      <text x="625" y="294" text-anchor="middle" fill="white" font-size="12" font-weight="700" font-family="Inter,sans-serif">Firebase Auth</text>
      <line x1="530" y1="306" x2="720" y2="306" stroke="#f97316" stroke-width="0.5" opacity="0.4"/>
      <text x="625" y="320" text-anchor="middle" fill="#fed7aa" font-size="10" font-weight="600" font-family="Inter,sans-serif">[Container: Auth Service]</text>
      <text x="625" y="337" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="Inter,sans-serif">Sessão admin por</text>
      <text x="625" y="350" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="Inter,sans-serif">e-mail + senha</text>
      <text x="625" y="365" text-anchor="middle" fill="#64748b" font-size="9" font-family="Inter,sans-serif">Firebase Authentication SDK</text>

      <!-- Firebase Storage -->
      <rect x="530" y="410" width="190" height="110" rx="10" fill="#2d1a4e" stroke="#a855f7" stroke-width="1.5"/>
      <text x="625" y="434" text-anchor="middle" fill="white" font-size="12" font-weight="700" font-family="Inter,sans-serif">Firebase Storage</text>
      <line x1="530" y1="446" x2="720" y2="446" stroke="#a855f7" stroke-width="0.5" opacity="0.4"/>
      <text x="625" y="460" text-anchor="middle" fill="#e9d5ff" font-size="10" font-weight="600" font-family="Inter,sans-serif">[Container: File Storage]</text>
      <text x="625" y="477" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="Inter,sans-serif">Fotos dos colaboradores</text>
      <text x="625" y="490" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="Inter,sans-serif">JPG/PNG · máx 5 MB</text>
      <text x="625" y="505" text-anchor="middle" fill="#64748b" font-size="9" font-family="Inter,sans-serif">/equipe/{imageId}</text>

      <!-- Firebase Hosting (infra label) -->
      <rect x="240" y="425" width="240" height="90" rx="10" fill="#141e2e" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="5,3"/>
      <text x="360" y="450" text-anchor="middle" fill="#475569" font-size="12" font-weight="600" font-family="Inter,sans-serif">Firebase Hosting</text>
      <line x1="240" y1="462" x2="480" y2="462" stroke="#334155" stroke-width="0.5" opacity="0.4"/>
      <text x="360" y="477" text-anchor="middle" fill="#334155" font-size="10" font-family="Inter,sans-serif">[Infrastructure: CDN]</text>
      <text x="360" y="492" text-anchor="middle" fill="#2d3748" font-size="9" font-family="Inter,sans-serif">Serve o build estático (/out)</text>
      <text x="360" y="506" text-anchor="middle" fill="#2d3748" font-size="9" font-family="Inter,sans-serif">Deploy via Firebase CLI</text>

      <!-- ── EXTERNAL SYSTEMS (outside boundary) ── -->

      <!-- EmailJS -->
      <rect x="790" y="110" width="170" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="875" y="136" text-anchor="middle" fill="white" font-size="13" font-weight="600" font-family="Inter,sans-serif">EmailJS</text>
      <line x1="790" y1="148" x2="960" y2="148" stroke="#334155" stroke-width="0.5"/>
      <text x="875" y="162" text-anchor="middle" fill="#64748b" font-size="10" font-family="Inter,sans-serif">[External System]</text>
      <text x="875" y="178" text-anchor="middle" fill="#475569" font-size="9" font-family="Inter,sans-serif">Alerta por e-mail</text>
      <text x="875" y="191" text-anchor="middle" fill="#475569" font-size="9" font-family="Inter,sans-serif">client-side · SaaS</text>

      <!-- WhatsApp Web -->
      <rect x="790" y="240" width="170" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="875" y="266" text-anchor="middle" fill="white" font-size="13" font-weight="600" font-family="Inter,sans-serif">WhatsApp Web</text>
      <line x1="790" y1="278" x2="960" y2="278" stroke="#334155" stroke-width="0.5"/>
      <text x="875" y="292" text-anchor="middle" fill="#64748b" font-size="10" font-family="Inter,sans-serif">[External System]</text>
      <text x="875" y="308" text-anchor="middle" fill="#475569" font-size="9" font-family="Inter,sans-serif">Contato com alunos</text>
      <text x="875" y="321" text-anchor="middle" fill="#475569" font-size="9" font-family="Inter,sans-serif">via link gerado</text>

      <!-- ── ARROWS ── -->

      <!-- Aluno → Web App -->
      <line x1="142" y1="242" x2="240" y2="184" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arr-blue)"/>
      <text x="178" y="220" text-anchor="middle" fill="#60a5fa" font-size="9" font-family="Inter,sans-serif">Usa o totem</text>
      <text x="178" y="232" text-anchor="middle" fill="#60a5fa" font-size="9" font-family="Inter,sans-serif">[HTTPS / Browser]</text>

      <!-- Admin → Web App -->
      <line x1="152" y1="465" x2="240" y2="380" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arr-blue)"/>
      <text x="182" y="432" text-anchor="middle" fill="#60a5fa" font-size="9" font-family="Inter,sans-serif">Acessa painel</text>
      <text x="182" y="444" text-anchor="middle" fill="#60a5fa" font-size="9" font-family="Inter,sans-serif">[HTTPS / Browser]</text>

      <!-- Web App → Firestore -->
      <line x1="480" y1="155" x2="530" y2="160" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
      <text x="505" y="148" text-anchor="middle" fill="#64748b" font-size="9" font-family="Inter,sans-serif">Lê/escreve</text>
      <text x="505" y="160" text-anchor="middle" fill="#64748b" font-size="9" font-family="Inter,sans-serif">[Firebase SDK]</text>

      <!-- Web App → Firebase Auth -->
      <line x1="480" y1="220" x2="530" y2="310" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
      <text x="494" y="276" text-anchor="middle" fill="#64748b" font-size="9" font-family="Inter,sans-serif">Autentica</text>
      <text x="494" y="288" text-anchor="middle" fill="#64748b" font-size="9" font-family="Inter,sans-serif">[Firebase SDK]</text>

      <!-- Web App → Firebase Storage -->
      <line x1="360" y1="258" x2="360" y2="425" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
      <text x="328" y="355" text-anchor="end" fill="#64748b" font-size="9" font-family="Inter,sans-serif">Upload</text>
      <text x="328" y="367" text-anchor="end" fill="#64748b" font-size="9" font-family="Inter,sans-serif">de fotos</text>
      <!-- curved routing: connect Web App bottom to Storage via path -->
      <path d="M 360 258 Q 360 430 530 465" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
      <!-- remove previous straight line -->

      <!-- Web App → EmailJS (external) -->
      <line x1="480" y1="134" x2="790" y2="148" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
      <text x="636" y="126" text-anchor="middle" fill="#64748b" font-size="9" font-family="Inter,sans-serif">Envia alerta crítico  [HTTPS]</text>

      <!-- Web App → WhatsApp -->
      <path d="M 480 200 Q 640 240 790 265" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
      <text x="650" y="248" text-anchor="middle" fill="#64748b" font-size="9" font-family="Inter,sans-serif">Abre link  [HTTPS]</text>
    </svg>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#1d4ed8;border:1px solid #3b82f6"></div>Person</div>

    <div class="legend-item"><div class="legend-dot" style="background:#2d1a4e;border:1px solid #a855f7"></div>Container Storage</div>
    <div class="legend-item"><div class="legend-dot" style="background:#1e293b;border:1px solid #334155"></div>External System</div>
    <div class="legend-item"><div class="legend-dot" style="background:transparent;border:1px dashed #1e3a5f"></div>System Boundary</div>
  </div>
  <p class="note" style="margin-top:28px;font-size:11px;color:#334155;font-family:'JetBrains Mono',monospace;">C4 Model · Nível 2 · gym-survey-app · 2026</p>
